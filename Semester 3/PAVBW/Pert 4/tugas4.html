<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Tugas Form</title>
</head>
<body>

    <form action="#" method="get">

        <table align="center" border="1">

            <tr>
                <th colspan="3">Form Registrasi</th>
            </tr>

            <tr>
                <td>User ID</td>
                <td>:</td>
                <td><input type="text"></td>
            </tr>

            <tr>
                <td>Nama</td>
                <td>:</td>
                <td><input type="text"></td>
            </tr>

            <tr>
                <td>Password</td>
                <td>:</td>
                <td><input type="password"></td>
            </tr>

            <tr>
                <td>Re-Pass</td>
                <td>:</td>
                <td><input type="password"></td>
            </tr>

            <tr>
                <td>Alamat</td>
                <td>:</td>
                <td><textarea rows="8" cols="80"></textarea></td>
            </tr>

            <tr>
                <td>Jenis Kelamin</td>
                <td>:</td>
                <td>
                    <input name="klmn" type="radio">L
                    <input name="klmn" type="radio">P
                </td>
            </tr>

            <tr>
                <td>Agama</td>
                <td>:</td>
                <td><select name="agm">
                    <option value="Islam" selected>-- Pilih Agama --</option>
                    <option value="Islam">Islam</option>
                    <option value="Kristen">Kristen</option>
                    <option value="Katolik">Katolik</option>
                    <option value="Hindu">Hindu</option>
                    <option value="Buddha">Buddha</option>
                    <option value="Konghucu">Konghucu</option>
                </select></td>
            </tr>

            <tr>
                <td>Hobi</td>
                <td>:</td>
                <td>
                    <input type="checkbox">makan
                    <input type="checkbox">olahraga
                    <input type="checkbox">lain lain
                </td>
            </tr>

            <tr>
                <td colspan="3" style="text-align: center;">
                    <input type="submit" value="DAFTAR">
                    <input type="reset" value="ULANGI">
                </td>
            </tr>

        </table>

    </form>

</body>
</html>
