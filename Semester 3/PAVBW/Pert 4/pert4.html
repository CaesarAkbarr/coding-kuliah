<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Pembuatan Form</title>
</head>
<body>

    <form action="perkenalan.html" method="post">
        <!--Text-->
        Nama Depan:
        <input type="text" placeholder="Nama depan boss">
        <br>
        Nama Belakang:
        <input type="text" placeholder="Nama belakang boss">
        <br>

        <!--List-->
        List Makanan:
        <br>
        Ayam goreng <input type="checkbox" name="mkn">
        <br>
        Iwak tempe <input type="checkbox" name="mkn">
        <br>
        Sego tworock <input type="checkbox" name="mkn">
        <br>

        <!--Radio select-->
        Jenis Kelamin:
        <br>
        Cowo <input type="radio" name="klm">
        <br>
        Cewe <input type="radio" name="klm">
        <br>

        <!--Button and Password-->
        <input type="password">
        <input type="submit" value="Gas!">
        <input type="reset" value="Hapus">
        <br>

        <!--Long text-->
        Alamat:
        <br>
        <textarea name="almt" rows="8" cols="80"></textarea>
        <br>

        <!--Select-->
        Agama:
        <br>
        <select name="agm">
            <option value="Islam">Islam</option>
            <option value="Kristen">Kristen</option>
            <option value="Katolik">Katolik</option>
            <option value="Hindu">Hindu</option>
            <option value="Buddha">Buddha</option>
            <option value="Konghucu">Konghucu</option>
        </select>
        <br>



    </form>

</body>
</html>
