<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>
      {% block title %}Sistem Pengambilan Mata Kuliah (KRS){% endblock %}
    </title>
    <!-- Bootstrap 5 CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <!-- Bootstrap Icons -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    />
    <style>
      body {
        background-color: #f8f9fa;
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica,
          Arial, sans-serif;
      }
      .navbar-brand {
        font-weight: 700;
        letter-spacing: 0.5px;
      }
    </style>
  </head>
  <body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm mb-4">
      <div class="container">
        <a class="navbar-brand" href="{{ url_for('index') }}">
          <i class="bi bi-mortarboard-fill me-2"></i>Portal KRS Mahasiswa
        </a>
        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#navMenu"
        >
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navMenu">
          <ul class="navbar-nav ms-auto align-items-center">
            {% if session.get('user_id') %}
            <li class="nav-item me-3 text-light">
              <span class="badge bg-secondary p-2">
                <i class="bi bi-person-circle me-1"></i> {{ session.get('nama')
                }} ({{ session.get('nim') }})
              </span>
            </li>
            <li class="nav-item">
              <a
                class="btn btn-outline-danger btn-sm"
                href="{{ url_for('logout') }}"
              >
                <i class="bi bi-box-arrow-right me-1"></i>Logout
              </a>
            </li>
            {% else %}
            <li class="nav-item">
              <a class="nav-link" href="{{ url_for('login') }}">Login</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="{{ url_for('register') }}">Register</a>
            </li>
            {% endif %}
          </ul>
        </div>
      </div>
    </nav>

    <div class="container pb-5">{% block content %}{% endblock %}</div>

    <!-- jQuery 3.7.1 -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <!-- Bootstrap 5 Bundle JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Custom Script jQuery -->
    <script src="{{ url_for('static', filename='js/krs.js') }}"></script>
    <!-- Reusable Pop-up Modal Notifikasi (Bootstrap & jQuery) -->
    <div
      class="modal fade"
      id="feedbackModal"
      tabindex="-1"
      aria-labelledby="feedbackModalLabel"
      aria-hidden="true"
    >
      <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content border-0 shadow">
          <div class="modal-header bg-danger text-white">
            <h5 class="modal-title fw-bold" id="feedbackModalLabel">
              <i class="bi bi-exclamation-triangle-fill me-2"></i
              ><span id="modalTitle">Peringatan</span>
            </h5>
            <button
              type="button"
              class="btn-close btn-close-white"
              data-bs-dismiss="modal"
              aria-label="Close"
            ></button>
          </div>
          <div class="modal-body text-center p-4">
            <div class="mb-3">
              <i
                class="bi bi-x-circle-fill text-danger"
                style="font-size: 3.5rem"
              ></i>
            </div>
            <h5 class="fw-bold text-dark mb-2" id="modalHeading"></h5>
            <p class="text-muted mb-0" id="modalBody"></p>
          </div>
          <div class="modal-footer justify-content-center border-0 pt-0 pb-4">
            <button
              type="button"
              class="btn btn-secondary px-4 fw-semibold"
              data-bs-dismiss="modal"
            >
              Tutup & Perbaiki
            </button>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
