{% extends 'base.html' %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-4">
        <div class="card shadow-sm">
            <div class="card-header bg-primary text-white">Login Pengguna</div>
            <div class="card-body">
                <form method="POST">
                    <div class="mb-3">
                        <label>Username</label>
                        <input type="text" name="username" class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Password</label>
                        <div class="input-group">
                            <input type="password" name="password" class="form-control" required placeholder="Masukkan password">
                            <button class="btn btn-outline-secondary toggle-password" type="button">Lihat</button>
                        </div>
                    </div>
                    <button type="submit" class="btn btn-primary w-100">Masuk</button>
                </form>
                <div class="mt-3 text-center">
                    <small>Belum punya akun? <a href="/register">Daftar di sini</a></small>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
