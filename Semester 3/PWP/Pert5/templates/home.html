{% extends 'base.html' %}
{% block content %}

<!-- Header Flexbox dengan Justify Content Between -->
<div class="d-flex justify-content-between align-items-center mb-4">
    <h2 class="m-0">Katalog Produk</h2>
    <button id="btnRefreshCatalog" class="btn btn-primary">
        <i class="bi bi-arrow-clockwise"></i> Refresh
    </button>
</div>

<!-- Indikator Loading -->
<div id="loading" class="text-center my-5">
    <div class="spinner-border text-primary" role="status">
        <span class="visually-hidden">Loading...</span>
    </div>
    <p class="mt-2 text-muted">Mengambil data dari FakeStoreAPI...</p>
</div>

<!-- Container kosong untuk dirender oleh jQuery -->
<div class="row" id="product-catalog"></div>

<!-- Jembatan data: Kirim state keranjang lokal ke JavaScript -->
<script>
    const userCartState = {{ cart_data | tojson | safe }};
</script>

{% endblock %}
