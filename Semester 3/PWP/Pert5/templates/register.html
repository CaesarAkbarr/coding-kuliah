{% extends 'base.html' %}
{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-4">
        <div class="card shadow-sm">
            <div class="card-header bg-success text-white">Daftar Akun Baru</div>
            <div class="card-body">
                <form method="POST" action="/register">
                    <div class="mb-3">
                        <label for="username" class="form-label">Username</label>
                        <input type="text" name="username" id="username" class="form-control" required placeholder="Masukkan username">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Password</label>
                        <div class="input-group">
                            <input type="password" name="password" class="form-control" required placeholder="Masukkan password">
                            <button class="btn btn-outline-secondary toggle-password" type="button">Lihat</button>
                        </div>
                    </div>
                    <button type="submit" class="btn btn-success w-100">Daftar Sekarang</button>
                </form>
                <div class="mt-3 text-center">
                    <small>Sudah punya akun? <a href="/login" class="text-decoration-none">Login di sini</a></small>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
